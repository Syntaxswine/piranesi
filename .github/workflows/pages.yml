# Deploy the game to GitHub Pages.
#
# There is no build step and there never will be: the game is ES modules and a
# 2-D canvas, served as-is. This workflow exists because the legacy Jekyll
# pipeline errored and then hung on this repo, and because "upload the
# repository, unchanged" is a more honest description of what should happen to
# a site with no dependencies than "run a static-site generator over it".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy half-done; queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The tests are cheap, have no dependencies, and the plate is
      # deterministic — so there is no reason to publish a build that is red.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test "test/*.test.mjs"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
