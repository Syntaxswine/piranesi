# Tests only.
#
# DEPLOYMENT IS NOT DONE HERE.  GitHub Pages serves this repo's main branch
# directly through its own builder; there is no build step and nothing to
# generate, so a deploy workflow would only be a slower way of copying files.
# (An Actions-based deploy was tried first and its `deploy-pages` step hung at
# `deployment_in_progress` until it timed out, twice, on a freshly created and
# then a freshly re-created Pages site. The legacy builder plus a `.nojekyll`
# file — which is what the sibling projects use — went green first time.)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No install step: there are no dependencies and there will not be any.
      - run: node --test "test/*.test.mjs"
      # The instruments are part of the deliverable, so they have to keep
      # running too — a broken plateshot means the next agent draws blind.
      - run: node tools/tonecheck.mjs --steps 8
      - run: node tools/plateshot.mjs --scene bay --size 300x300 --out /tmp/bay.png
      - run: node tools/moduleshot.mjs --module great-vault --size 300x260 --out /tmp/gv.png
      - run: node tools/blockshot.mjs --n 4 --cols 2 --size 300x260 --out /tmp/blocks.png
      # THE HAND IS ARCHIVED IN GIT.  If the generator changes what it deals,
      # this fails and the diff says exactly which blocks moved — so a re-deal
      # is something you SEE in a commit rather than something that happens to
      # you.  A saved building is safe either way; its recipes are in the file.
      - run: node tools/blockdump.mjs --check
      # THE WHOLE GRAMMAR IS ARCHIVED TOO, and for a stronger reason: the hand
      # is 24 blocks, this is all 10,826.  If a plan is added, retuned or
      # removed, the diff says what happened to the entire vocabulary — how many
      # blocks exist, which meet nothing, which grew a sealed chamber.  Its own
      # self-checks run first and it refuses to write if one fails.
      - run: node tools/census.mjs --check
      # THE HUNDRED, and the two properties no per-block filter can guarantee:
      # the kit must be ONE joinery component, and every block must have
      # something in the kit it can be set down on.
      - run: node tools/kit.mjs --check
      # And the terminal test: can the hundred actually TILE a building with
      # every seam exact?  A kit that cannot is a shelf of strangers.
      - run: node tools/assemble.mjs --w 5 --d 5 --h 3 --size 400x300 --out /tmp/asm.png
      # layershot is the one that would notice the layer feedback going flat.
      - run: node tools/layershot.mjs --layers 3 --layer 1 --size 320x220 --out /tmp/layers.png
