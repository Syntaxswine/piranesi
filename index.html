<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Piranesi — a block builder</title>
<style>
  /* The chrome is a drawing board, not a game UI: small, monospace, low
     saturation, warm and cool neutrals only.  The model is the spectacle and
     nothing else is allowed to be. */
  :root {
    --ground: #ecebe0;
    --desk:   #2b2a26;
    --panel:  #232220;
    --ink:    #38322a;
    --rule:   #8a877c;
    --hot:    #96502e;
    --cool:   #5b6570;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--desk); color: var(--ground);
    font: 11px/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  #app { display: flex; height: 100%; }

  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px; min-width: 0; min-height: 0;
  }
  #plate {
    background: var(--ground);
    box-shadow: 0 2px 5px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
    cursor: crosshair; touch-action: none; display: block;
  }
  body[data-mode="explore"] #plate { cursor: grab; }

  #side {
    width: 244px; flex: 0 0 244px; display: flex; flex-direction: column;
    border-left: 1px solid #131211; background: var(--panel);
  }
  header { padding: 11px 12px 9px; border-bottom: 1px solid #131211; }
  header h1 { margin: 0 0 3px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; }
  header p { margin: 0; color: var(--rule); font-size: 10px; }
  header a { color: var(--rule); }

  /* The layer readout is the single most important number on the panel: in a
     layer builder, not knowing which layer you are on is the whole of being
     lost. */
  #bar {
    display: flex; align-items: baseline; gap: 8px;
    padding: 7px 12px; border-bottom: 1px solid #131211; background: #1c1b19;
  }
  #layer { font-size: 13px; letter-spacing: .06em; }
  #rot { color: var(--hot); margin-left: auto; }

  /* The saved buildings.  Collapsed by default: it is a list you open when you
     want it, and the shelf is what you are looking at the rest of the time. */
  #saves { border-bottom: 1px solid #131211; padding: 6px 8px 8px; }
  #saves summary {
    cursor: pointer; color: var(--rule); font-size: 9px;
    text-transform: uppercase; letter-spacing: .16em; padding: 2px 2px 6px;
  }
  #saves summary:hover { color: var(--ground); }
  #savelist { margin-bottom: 6px; }
  #savelist .row2 { display: flex; gap: 4px; margin-bottom: 3px; }
  #savelist .pick {
    flex: 1; padding: 3px 6px; text-align: left; font: inherit; cursor: pointer;
    background: #2e2c28; color: var(--ground); border: 1px solid #3d3a34;
    border-radius: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #savelist .pick:hover { background: #383530; }
  #savelist .pick.on { border-color: var(--hot); color: var(--ground); }
  #savelist .drop {
    width: 22px; padding: 0; font: inherit; cursor: pointer; color: var(--rule);
    background: #2e2c28; border: 1px solid #3d3a34; border-radius: 2px;
  }
  #savelist .drop:hover { color: var(--hot); }
  #savelist .none { color: var(--rule); font-size: 9.5px; padding: 2px; }

  #shelf { flex: 1; overflow-y: auto; padding: 6px 8px 12px; }
  .fam {
    color: var(--rule); text-transform: uppercase; letter-spacing: .16em;
    font-size: 9px; margin: 11px 0 4px 2px;
  }
  .fam:first-child { margin-top: 2px; }
  .blk {
    display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
    width: 100%; padding: 4px 7px; margin-bottom: 2px; text-align: left;
    background: transparent; color: var(--ground);
    border: 1px solid transparent; border-radius: 2px;
    font: inherit; cursor: pointer;
  }
  .blk:hover { background: #2e2c28; border-color: #3d3a34; }
  .blk.on { background: var(--ground); color: var(--ink); border-color: var(--ground); }
  .blk .sz { color: var(--rule); font-size: 9px; }
  .blk.on .sz { color: #6e6a5c; }

  footer { border-top: 1px solid #131211; padding: 8px 12px 11px; }
  .keys { color: var(--rule); font-size: 9.5px; margin-bottom: 8px; }
  .keys b { color: var(--ground); font-weight: 400; }
  #recipe { color: var(--rule); font-size: 9.5px; margin-bottom: 7px; min-height: 1.4em; }
  .row { display: flex; gap: 6px; margin-bottom: 7px; }
  button.act {
    flex: 1; padding: 4px 6px; font: inherit;
    background: #2e2c28; color: var(--ground);
    border: 1px solid #3d3a34; border-radius: 2px; cursor: pointer;
  }
  button.act:hover { background: #383530; }
  #mode { text-transform: uppercase; letter-spacing: .12em; }
  #hud { color: var(--rule); font-size: 9.5px; line-height: 1.5; word-break: break-word; white-space: pre-line; }
  kbd {
    background: #2e2c28; border: 1px solid #3d3a34; border-bottom-width: 2px;
    border-radius: 2px; padding: 0 3px; font: inherit; color: var(--ground);
  }

  /* The anchor picker.  Small, dark, and it appears where you clicked — it is
     a question about one square inch of wall, not a dialog. */
  #picker {
    position: fixed; z-index: 20; min-width: 132px;
    background: var(--panel); border: 1px solid #4a4640;
    border-radius: 3px; padding: 3px;
    box-shadow: 0 4px 14px rgba(0,0,0,.55);
  }
  #picker .kind {
    display: block; width: 100%; text-align: left;
    padding: 4px 7px; margin: 0; border: 0; border-radius: 2px;
    background: transparent; color: var(--ground); font: inherit; cursor: pointer;
  }
  #picker .kind:hover { background: #34312c; }
  #picker .kind.on { background: var(--hot); }
  #picker .note { display: block; color: var(--rule); font-size: 9px; }
  #picker .kind.on .note { color: #e6d9cf; }
</style>
</head>
<body data-mode="build">
<div id="app">
  <div id="stage"><canvas id="plate"></canvas></div>

  <aside id="side">
    <header>
      <h1>Piranesi</h1>
      <p>One vast interior, a layer at a time. &nbsp;<a href="draw.html">draw a block &rsaquo;</a></p>
    </header>

    <div id="bar">
      <span id="layer">layer 0</span>
      <span id="rot">turn 0°</span>
    </div>

    <!-- The buildings you have saved. A <details> because it is a list you
         open when you want it and never otherwise, and native beats a widget. -->
    <details id="saves">
      <summary>buildings</summary>
      <div id="savelist"></div>
      <div class="row">
        <button class="act" id="saveas">save as</button>
        <button class="act" id="newb">new</button>
      </div>
      <div class="row">
        <button class="act" id="exportb">export</button>
        <button class="act" id="importb">import</button>
      </div>
    </details>

    <div id="shelf"></div>

    <footer>
      <div id="recipe"></div>
      <div class="keys">
        <b>scroll</b> or <kbd>PgUp</kbd><kbd>PgDn</kbd> change layer ·
        <b>shift-scroll</b> zoom<br>
        <kbd>Q</kbd><kbd>E</kbd> turn the view ·
        <kbd>R</kbd> turn the block ·
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> pan<br>
        click to place · right-click to take back · <kbd>Tab</kbd> to walk in<br>
        click a <span style="color:#b02e1a">red square</span> to set an anchor
      </div>
      <div class="row">
        <button class="act" id="mode">build</button>
        <button class="act" id="clear">clear</button>
      </div>
      <div id="hud"></div>
    </footer>
  </aside>
</div>
<script type="module" src="js/game.js"></script>
</body>
</html>
